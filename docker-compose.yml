# =================================================================
# Docker Compose for Personal AI Accountability Coach
# =================================================================

version: "3.8"

services:
  accountability-coach:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_accountability_coach
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
